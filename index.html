<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>金庸群侠传3 加强版</title>
<style>
  /* 中文字体:Flash 游戏内的文字依赖它(Ruffle 在浏览器里需要显式提供)
     这里把游戏可能请求的各种字体名都映射到同一份中文字体,避免"部分文字不显示" */
  @font-face { font-family: "Source Han Sans SC"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-weight: normal; font-style: normal; font-display: block; }
  @font-face { font-family: "宋体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "SimSun"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "新宋体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "NSimSun"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "黑体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "SimHei"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "微软雅黑"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "Microsoft YaHei"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "楷体"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "KaiTi"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "仿宋"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "FangSong"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_sans"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_serif"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  @font-face { font-family: "_typewriter"; src: url("./fonts/SourceHanSansSC-Regular.ttf") format("truetype"); font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 100%; height: 100%; }
  #stage ruffle-player, #stage embed, #stage object { width: 100% !important; height: 100% !important; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 8px; text-align: center;
    color: #aaa; font: 12px/1.5 system-ui, sans-serif; pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="hint">触摸 = 鼠标点击 · 加载中请稍候</div>

<!-- Ruffle: Flash 模拟器(WASM),同源自托管 -->
<script src="./ruffle/ruffle.js"></script>
<script>
(function () {
  window.RufflePlayer = window.RufflePlayer || {};
  window.RufflePlayer.config = {
    autoplay: "on",
    unmuteOverlay: "hidden",
    letterbox: "on",
    scale: "showAll",
    quality: "high",
    wmode: "direct",
    allowScriptAccess: false,
    splashScreen: false,
    contextMenu: "off",
    openUrlMode: "deny",
    logLevel: "warn",
    /* 中文显示的关键:把 Flash 的字体请求映射到页面里的中文字体 */
    defaultFonts: {
      sans: ["Source Han Sans SC"],
      serif: ["Source Han Sans SC"],
      monospace: ["Source Han Sans SC"],
      cursive: ["Source Han Sans SC"],
      fantasy: ["Source Han Sans SC"]
    }
  };

  var FONT_URL = "./fonts/SourceHanSansSC-Regular.ttf";
  /* 游戏(Flash)会按这些字体名请求文字,全部指向同一份中文字体 */
  var FONT_NAMES = ["宋体", "SimSun", "新宋体", "NSimSun", "黑体", "SimHei",
                    "微软雅黑", "Microsoft YaHei", "楷体", "KaiTi", "仿宋", "FangSong",
                    "Source Han Sans SC", "sans", "serif", "monospace", "typewriter"];

  function boot() {
    try {
      var ruffle = window.RufflePlayer.newest();
      var player = ruffle.createPlayer();
      player.id = "rufflePlayer";
      document.getElementById("stage").appendChild(player);
      /* 关键:把中文字体"注册"给引擎,否则引擎找不到字体 → 文字全部丢失 */
      player.ruffle().load({
        url: "play.swf",
        fontSources: FONT_NAMES.map(function (n) {
          return { name: n, data: FONT_URL };
        })
      });
    } catch (e) {
      document.getElementById("hint").textContent = "初始化失败: " + e.message;
    }
  }

  if (document.readyState === "complete") { boot(); }
  else { window.addEventListener("load", boot); }
})();
</script>
</body>
</html>
